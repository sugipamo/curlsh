name: Validate curlsh

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-yaml shellcheck
          python3 -m venv /tmp/machine-bootstrap-lint
          /tmp/machine-bootstrap-lint/bin/pip install ansible-core ansible-lint
      - name: Check install arguments
        run: ./tests/test-install.sh
      - name: Check playbook syntax
        run: /tmp/machine-bootstrap-lint/bin/ansible-playbook -i localhost, -c local playbook.yml -e bootstrap_platform=vm --syntax-check
      - name: Lint Ansible
        run: /tmp/machine-bootstrap-lint/bin/ansible-lint playbook.yml

  debian-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply and re-apply base and Codex on Debian 13
        run: |
          docker run --rm -v "$PWD:/workspace:ro" debian:13 bash -ceu '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ansible-core python3-apt
            cd /workspace
            ./install.sh --non-interactive --platform lxc --components base,codex
            grep -qx "  - codex" /etc/curlsh/config.yaml
            grep -qx "ref=local" /var/lib/curlsh/state
            PATH=/sbin:/bin:/usr/sbin:/usr/bin codex --version
            # The second run applies the saved declaration without arguments.
            second_run="$(./install.sh --non-interactive)"
            printf "%s\n" "$second_run"
            printf "%s\n" "$second_run" | grep -Eq "changed=0[[:space:]]"
          '
