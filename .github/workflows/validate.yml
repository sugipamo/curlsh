name: Validate curlsh

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check arguments and config parsing
        run: ./tests/test-install.sh

  debian-smoke:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        debian: ['12', '13']
    steps:
      - uses: actions/checkout@v7
      - name: Apply twice on minimal Debian ${{ matrix.debian }}
        run: |
          docker run --rm -v "$PWD:/workspace:ro" "debian:${{ matrix.debian }}" bash -ceu '
            # A real machine already has curl, since it ran curl | bash.
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl ca-certificates
            config=/workspace/tests/smoke.yaml
            /workspace/install.sh --config "$config"
            PATH=/usr/bin:/bin codex --version
            gh --version
            second_run="$(/workspace/install.sh --config "$config")"
            printf "%s\n" "$second_run"
            printf "%s\n" "$second_run" | grep -qx "Done: 0 change(s)"
            /workspace/install.sh --check --config "$config" | grep -qx "Check: 0 change(s) needed"
            # curlsh keeps nothing of its own on the machine.
            test ! -e /etc/curlsh && test ! -e /var/lib/curlsh
            if command -v ansible-playbook || command -v gum; then exit 1; fi
          '
