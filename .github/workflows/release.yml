name: Release

# Push a vX.Y.Z tag, or run this workflow by hand with a new tag name to
# create that tag on the selected branch.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (vX.Y.Z)
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pick the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=${INPUT_TAG:-$GITHUB_REF_NAME}
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $tag" >&2; exit 1; }
          # A manual run builds from the branch, so it must not touch an existing tag.
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]] &&
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; push a new tag instead" >&2
            exit 1
          fi
          echo "TAG=$tag" >>"$GITHUB_ENV"
      - name: Embed the release tag in install.sh
        run: |
          mkdir dist
          sed "s/^embedded_ref=\$/embedded_ref=$TAG/" install.sh >dist/install.sh
          grep -qx "embedded_ref=$TAG" dist/install.sh
          bash -n dist/install.sh
      - name: Publish install.sh as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a tag push the tag exists already and --target is ignored.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          gh release upload "$TAG" dist/install.sh --clobber
