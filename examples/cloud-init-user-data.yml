#cloud-config
# Apply a curlsh config with a pinned curlsh release on first boot.
# This runs as root during Cloud-Init's final stage. Keep credentials out of
# user-data. Later, run the same command again to upgrade the machine.
runcmd:
  - - bash
    - -o
    - pipefail
    - -c
    - >-
      curl -fsSL https://github.com/sugipamo/curlsh/releases/download/v0.3.0/install.sh
      | bash -s -- --config https://example.com/vm.yaml
