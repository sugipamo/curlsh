---
- name: Ensure prerequisites for GitHub CLI
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download GitHub CLI signing keyring
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'

- name: Configure GitHub CLI repository
  # apt_repository needs gpg, which minimal Debian lacks.
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/github-cli.list
    content: |
      deb [arch={{ deb_arch }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main
    mode: '0644'
  vars:
    deb_arch: "{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
  register: github_cli_repository

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: "{{ github_cli_repository is changed }}"
