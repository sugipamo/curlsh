---
- name: Inspect installed Codex version
  ansible.builtin.command: /usr/local/bin/codex --version
  register: codex_installed_version
  changed_when: false
  failed_when: false

- name: Install Codex if the pinned version is missing
  when: codex_installed_version.rc != 0 or codex_installed_version.stdout != 'codex-cli ' ~ codex_version
  block:
    - name: Download official Codex installer
      ansible.builtin.get_url:
        url: https://chatgpt.com/codex/install.sh
        dest: /var/tmp/machine-bootstrap-codex-install.sh
        mode: '0755'
        force: true

    - name: Install pinned Codex CLI
      ansible.builtin.command:
        argv:
          - /bin/sh
          - /var/tmp/machine-bootstrap-codex-install.sh
          - --release
          - '{{ codex_version }}'
      changed_when: true
      environment:
        CODEX_NON_INTERACTIVE: '1'
        CODEX_INSTALL_DIR: /usr/local/bin
        CODEX_HOME: /usr/local/lib/codex

- name: Inspect minimal-PATH Codex entry
  ansible.builtin.stat:
    path: /usr/bin/codex
    follow: false
  register: codex_system_link

- name: Protect an existing /usr/bin/codex
  ansible.builtin.assert:
    that:
      - not codex_system_link.stat.exists or
        (codex_system_link.stat.islnk and codex_system_link.stat.lnk_target == '/usr/local/bin/codex')
    fail_msg: /usr/bin/codex exists and is not the managed link

- name: Expose Codex to minimal SSH PATH
  ansible.builtin.file:
    src: /usr/local/bin/codex
    dest: /usr/bin/codex
    state: link

- name: Verify Codex executable through minimal PATH
  ansible.builtin.command: /usr/bin/codex --version
  register: codex_verified_version
  changed_when: false
  failed_when: codex_verified_version.rc != 0 or codex_verified_version.stdout != 'codex-cli ' ~ codex_version
