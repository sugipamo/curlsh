---
- name: Require a VM for qemu-guest-agent
  ansible.builtin.assert:
    that: bootstrap_platform == 'vm'
    fail_msg: qemu_guest_agent requires --platform vm

- name: Install qemu-guest-agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable qemu-guest-agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started
